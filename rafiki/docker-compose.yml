# Rafiki (Open Payments) para desarrollo local de Caja de Barrio.
#
# Un solo ASE (account servicing entity) = Caja de Barrio, con su backend,
# su servidor de autorizacion GNAP y la base de datos contable en Postgres.
#
# Los tres servicios `rafiki-*` usan imagenes publicadas y fijadas por version,
# no se compila nada desde el monorepo de Rafiki.
#
# Uso:  ./scripts/init.sh && docker compose up -d
# Ver:  README.md

name: rafiki-caja-barrio

services:
  postgres:
    image: postgres:16-alpine
    container_name: rafiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rafiki}
      # Requerido: lo genera scripts/init.sh (hex, sin caracteres que rompan la URL).
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD, ejecuta ./scripts/init.sh}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/dbinit.sql:/docker-entrypoint-initdb.d/10-dbinit.sql:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rafiki} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [rafiki]

  redis:
    image: redis:7-alpine
    container_name: rafiki-redis
    restart: unless-stopped
    # Cache y datos de ILP: no necesita persistencia en desarrollo.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [rafiki]

  # Servidor de recursos Open Payments + connector ILP + Admin API (GraphQL).
  rafiki-backend:
    image: ghcr.io/interledger/rafiki-backend:${RAFIKI_VERSION:-v2.4.5-de}
    container_name: rafiki-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '${OPEN_PAYMENTS_PORT:-3000}:3000' # API Open Payments
      - '${ADMIN_API_PORT:-3001}:3001' # Admin API (GraphQL)
      - '${CONNECTOR_PORT:-3002}:3002' # ILP over HTTP
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      INSTANCE_NAME: ${INSTANCE_NAME:-Caja de Barrio}
      TRUST_PROXY: 'false'
      OPEN_PAYMENTS_PORT: 3000
      ADMIN_PORT: 3001
      CONNECTOR_PORT: 3002
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rafiki}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD, ejecuta ./scripts/init.sh}@postgres:5432/${BACKEND_DB:-rafiki_backend}"
      REDIS_URL: redis://redis:6379/0
      # Contabilidad en Postgres para minimizar piezas moviles.
      # Para TigerBeetle usa el overlay: -f compose.tigerbeetle.yml
      USE_TIGERBEETLE: 'false'
      # URL publica del servidor de recursos: es la base de cada wallet address.
      OPEN_PAYMENTS_URL: ${OPEN_PAYMENTS_URL:-http://localhost:3000}
      WALLET_ADDRESS_URL: ${WALLET_ADDRESS_URL:-http://rafiki-backend:3000/.well-known/pay}
      ILP_ADDRESS: ${ILP_ADDRESS:-test.caja-de-barrio}
      ILP_CONNECTOR_URL: ${ILP_CONNECTOR_URL:-http://rafiki-backend:3002}
      AUTH_SERVER_GRANT_URL: http://rafiki-auth:3006
      AUTH_SERVER_INTROSPECTION_URL: http://rafiki-auth:3007
      AUTH_SERVICE_API_URL: http://rafiki-auth:3011
      # Clave Ed25519 del ASE. Si no se fija PRIVATE_KEY_FILE, Rafiki genera una
      # clave efimera en memoria y la pierde en cada reinicio.
      KEY_ID: ${KEY_ID:?}
      PRIVATE_KEY_FILE: /home/rafiki/keys/private-key.pem
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:?}
      SIGNATURE_SECRET: ${SIGNATURE_SECRET:?}
      SIGNATURE_VERSION: '1'
      STREAM_SECRET: ${STREAM_SECRET:?}
      DB_ENCRYPTION_SECRET: ${DB_ENCRYPTION_SECRET:?}
      OPERATOR_TENANT_ID: ${OPERATOR_TENANT_ID:?}
      # Endpoints que debe exponer nuestro backend (rol de ASE).
      WEBHOOK_URL: ${WEBHOOK_URL:-http://host.docker.internal:8000/webhooks}
      EXCHANGE_RATES_URL: ${EXCHANGE_RATES_URL:-http://host.docker.internal:8000/rates}
      ENABLE_TELEMETRY: 'false'
      ENABLE_SPSP_PAYMENT_POINTERS: 'true'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./config/keys:/home/rafiki/keys:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [rafiki]

  # Servidor de autorizacion GNAP + Admin API de auth.
  rafiki-auth:
    image: ghcr.io/interledger/rafiki-auth:${RAFIKI_VERSION:-v2.4.5-de}
    container_name: rafiki-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '${AUTH_ADMIN_PORT:-3003}:3003' # Admin API (GraphQL)
      - '${AUTH_PORT:-3006}:3006' # Open Payments authorization server
      - '${INTROSPECTION_PORT:-3007}:3007' # Introspeccion de access tokens
      - '${INTERACTION_PORT:-3009}:3009' # Interaccion del usuario (grant interactivo)
      - '${AUTH_SERVICE_API_PORT:-3011}:3011' # API servicio a servicio
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      TRUST_PROXY: 'false'
      ADMIN_PORT: 3003
      AUTH_PORT: 3006
      INTROSPECTION_PORT: 3007
      INTERACTION_PORT: 3009
      SERVICE_API_PORT: 3011
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-rafiki}:${POSTGRES_PASSWORD:?}@postgres:5432/${AUTH_DB:-rafiki_auth}
      REDIS_URL: redis://redis:6379/1
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://localhost:3006}
      # URL del IdP: la abre el navegador del usuario, no el contenedor.
      IDENTITY_SERVER_URL: ${IDENTITY_SERVER_URL:-http://localhost:8000/idp/}
      IDENTITY_SERVER_SECRET: ${IDENTITY_SERVER_SECRET:?}
      COOKIE_KEY: ${COOKIE_KEY:?}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:?}
      OPERATOR_TENANT_ID: ${OPERATOR_TENANT_ID:?}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3003/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [rafiki]

  # UI de administracion de Rafiki. Pide Tenant ID + API Secret y necesita HTTPS o
  # un tunel SSH: su cookie de sesion va con Secure y el navegador la descarta sobre http.
  rafiki-admin:
    image: ghcr.io/interledger/rafiki-frontend:${RAFIKI_VERSION:-v2.4.5-de}
    container_name: rafiki-admin
    restart: unless-stopped
    depends_on:
      rafiki-backend:
        condition: service_healthy
    ports:
      - '${ADMIN_UI_PORT:-3010}:3010'
    environment:
      PORT: 3010
      # La imagen de produccion corre `remix-serve`: en modo development exige
      # REMIX_DEV_ORIGIN y el contenedor entra en bucle de reinicio.
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      GRAPHQL_URL: http://rafiki-backend:3001/graphql
      OPEN_PAYMENTS_URL: ${OPEN_PAYMENTS_URL:-http://localhost:3000}
      AUTH_ENABLED: 'false'
      ENABLE_INSECURE_MESSAGE_COOKIE: 'true'
      SIGNATURE_VERSION: '1'
      SIGNATURE_SECRET: ${SIGNATURE_SECRET:?}
    networks: [rafiki]

  # Backend de Caja de Barrio: el ASE que Rafiki llama (webhooks, tipos de cambio e
  # IdP) y el cliente Open Payments. Corre DENTRO de la red `rafiki` a proposito:
  # los contenedores no alcanzan los puertos TCP del host (host.docker.internal no
  # responde desde aca), asi que un backend en el host nunca recibiria un webhook.
  # El puerto se publica igual, porque el IdP lo abre el navegador del usuario.
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: caja-de-barrio-backend:local
    container_name: caja-de-barrio-backend
    restart: unless-stopped
    depends_on:
      rafiki-backend:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_ADDR: ':8000'
      # La Admin API se alcanza por nombre de servicio, no por localhost.
      RAFIKI_ADMIN_URL: http://rafiki-backend:3001/graphql
      # Base efectiva de las wallet addresses del ASE: el ajuste por tenant
      # WALLET_ADDRESS_URL de la base. El seed la lee y exige https (Rafiki rechaza
      # toda wallet address URL que no lo sea); el backend no la usa en ejecucion.
      RAFIKI_OPEN_PAYMENTS_URL: https://rafiki-backend:3000
      RAFIKI_TENANT_ID: ${OPERATOR_TENANT_ID:?}
      RAFIKI_ADMIN_API_SECRET: ${ADMIN_API_SECRET:?}
      RAFIKI_SIGNATURE_SECRET: ${SIGNATURE_SECRET:?}
      RAFIKI_IDENTITY_SERVER_SECRET: ${IDENTITY_SERVER_SECRET:?}
      # El IdP necesita las dos bases del auth server: la interna para hablar servidor
      # a servidor (la publica no es alcanzable desde el contenedor) y la publica para
      # el redirect con el que el navegador cierra la interaccion.
      RAFIKI_AUTH_SERVER_URL: http://rafiki-auth:3006
      RAFIKI_AUTH_SERVER_PUBLIC_URL: ${AUTH_SERVER_URL:?}
      OP_KEY_ID: ${KEY_ID:-}
      OP_PRIVATE_KEY_PATH: /home/backend/keys/op-private-key.pem
    volumes:
      # La MISMA clave que registro el seed: si el contenedor generara otra, el JWK
      # registrado en la wallet address dejaria de verificar.
      - ../keys:/home/backend/keys:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [rafiki]

networks:
  rafiki:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

volumes:
  postgres-data:
